services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: document_intelligence
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U app -d document_intelligence",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: